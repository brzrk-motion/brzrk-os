# BRZRK OS GNOME defaults for creative workstations.
# System dconf overlay (same mechanism as cachyos-gnome-settings).
# Applied under /etc/dconf/db/local.d/ — requires dconf update after install.

[org/gnome/desktop/interface]
color-scheme='prefer-dark'
clock-show-seconds=false
enable-hot-corners=false
font-name='Inter 11'
document-font-name='Inter 11'
monospace-font-name='Source Code Pro 11'

[org/gnome/desktop/wm/preferences]
button-layout='appmenu:minimize,maximize,close'
num-workspaces=4
focus-mode='click'

[org/gnome/mutter]
dynamic-workspaces=false
workspaces-only-on-primary=false
experimental-features=['scale-monitor-framebuffer', 'variable-refresh-rate']

[org/gnome/desktop/peripherals/touchpad]
tap-to-click=true
natural-scroll=true

[org/gnome/desktop/peripherals/mouse]
accel-profile='flat'

[org/gnome/desktop/screensaver]
lock-enabled=true

[org/gnome/nautilus/preferences]
default-folder-viewer='list-view'
show-hidden-files=false

[org/gnome/nautilus/list-view]
use-tree-view=true
default-zoom-level='small'

[org/gnome/shell]
favorite-apps=['org.gnome.Nautilus.desktop', 'org.gnome.Ptyxis.desktop', 'blender.desktop', 'gimp.desktop', 'org.inkscape.Inkscape.desktop', 'org.kde.krita.desktop', 'com.obsproject.Studio.desktop', 'org.gnome.Settings.desktop']
