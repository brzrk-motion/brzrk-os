# Tokyo Night palette for Starship.
add_newline = false
palette = 'tokyo-night'

format = "[$username@$hostname](fg:blue) [$directory](fg:cyan) [$git_branch$git_status](fg:purple) $character"

[character]
success_symbol = '[❯](fg:green)'
error_symbol = '[❯](fg:red)'

[directory]
truncation_length = 3
truncate_to_repo = false

[git_branch]
format = '[$branch]($style) '

[git_status]
format = '([$all_status$ahead_behind]($style))'

[palettes.tokyo-night]
background = '#1a1b26'
foreground = '#c0caf5'
blue = '#7aa2f7'
cyan = '#7dcfff'
green = '#9ece6a'
purple = '#bb9af7'
red = '#f7768e'
yellow = '#e0af68'
